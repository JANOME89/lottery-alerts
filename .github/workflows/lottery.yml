name: Lottery check

on:
  schedule:
    # каждые 20 минут; GitHub может задерживать запуск на 5-15 минут — это нормально
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python lottery_check.py

      - name: Save state
        run: |
          if [ -f state.json ]; then
            git config user.name "lottery-bot"
            git config user.email "lottery-bot@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || git commit -m "state: round $(date -u +%FT%T)"
            git push
          fi

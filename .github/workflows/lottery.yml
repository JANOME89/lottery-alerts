name: Lottery check
# v3: один длинный прогон вместо частого cron

on:
  schedule:
    # запуск каждые 6 часов; каждый прогон живёт ~5.85 ч, то есть окно
    # последнего часа розыгрыша почти всегда попадает внутрь работающего джоба
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lottery
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 357
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run check loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_INTERVAL: "60"
        run: python lottery_check.py --loop-hours 5.85

      - name: Save state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "lottery-bot"
            git config user.email "lottery-bot@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || git commit -m "state: round $(date -u +%FT%T)"
            git pull --rebase --autostash || true
            git push || true
          fi
